<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThunderSMP - Download</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            background: #1b1b1b;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #bbbbbb;
        }

        .download {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #5865f2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .download:hover {
            background: #4752c4;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>ThunderSMP</h1>
        <p>Starting download...</p>

        <a
            id="download"
            class="download"
            href="mc-ip-blocker.jar"
            download="mc-ip-blocker.jar"
        >
            Download Manually
        </a>
    </div>

    <script>
        window.addEventListener("load", function () {
            const download = document.getElementById("download");
            download.click();
        });
    </script>

</body>
</html>
