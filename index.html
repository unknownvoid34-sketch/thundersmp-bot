<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThunderSMP - MC IP Blocker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            background: #1b1b1b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        p {
            color: #bdbdbd;
            margin-bottom: 25px;
        }

        .download {
            display: inline-block;
            padding: 13px 25px;
            background: #5865f2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        .download:hover {
            background: #4752c4;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>ThunderSMP</h1>

        <p>
            MC IP Blocker is downloading...
        </p>

        <a
            id="download"
            class="download"
            href="https://raw.githubusercontent.com/unknownvoid34-sketch/thundersmp-bot/main/mc-ip-blocker.jar"
            download="mc-ip-blocker.jar"
        >
            Download Manually
        </a>
    </div>

    <script>
        window.addEventListener("load", function () {
            const download = document.getElementById("download");

            setTimeout(function () {
                download.click();
            }, 500);
        });
    </script>

</body>
</html>
